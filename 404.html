<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 季亦飞作品集</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B4DB1'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle' font-family='sans-serif'%3E%E5%AD%A3%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(800px 420px at 15% -10%,rgba(47,111,228,.35),transparent 60%),
               radial-gradient(700px 400px at 90% 10%,rgba(14,143,126,.28),transparent 62%),
               linear-gradient(150deg,#071426,#0E2A4A 46%,#123A63);color:#fff}
  .box{max-width:560px;text-align:center}
  .code{font-size:clamp(64px,16vw,120px);font-weight:800;letter-spacing:-.04em;line-height:1;
    background:linear-gradient(160deg,#fff,#7FA9F5);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:clamp(19px,3.4vw,26px);margin:14px 0 10px}
  p{color:#B9C9DC;font-size:15px;line-height:1.9}
  a{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:12px 24px;border-radius:999px;
    background:#2F6FE4;color:#fff;text-decoration:none;font-weight:600;font-size:15px;
    box-shadow:0 12px 30px -14px rgba(47,111,228,1);transition:transform .18s ease}
  a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>你访问的地址不存在，或已被移动到其他位置。<br>返回作品集首页继续浏览标注案例与质检流程。</p>
    <a id="home" href="/">← 返回作品集首页</a>
  </div>
  <script>
    /* 兼容 GitHub Pages 项目页（/仓库名/...）与用户页两种部署路径 */
    (function () {
      var m = location.pathname.match(/^\/([^\/]+)\//);
      if (m && m[1] && m[1].indexOf('.') === -1) {
        document.getElementById('home').setAttribute('href', '/' + m[1] + '/');
      }
    })();
  </script>
</body>
</html>
